<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Test - Lieferung Berechnung</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .test-container {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ccc;
        }

        input {
            margin: 5px;
            padding: 5px;
        }

        button {
            margin: 10px;
            padding: 10px;
        }

        .result {
            margin: 10px 0;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Test - Paletten-Berechnung</h1>

    <div class="test-container">
        <h3>Eingabe:</h3>
        <label>Erste Gebinde Nr.: <input type="text" id="erste_gebinde" value="G-0001" /></label><br>
        <label>Letzte Gebinde Nr.: <input type="text" id="letzte_gebinde" value="G-0100" /></label><br>

        <h3>Berechnete Ergebnisse:</h3>
        <div class="result">Anzahl Gebinde: <span id="anzahl_gebinde">-</span></div>
        <div class="result">Anzahl Paletten: <span id="anzahl_paletten">-</span></div>

        <button onclick="testBerechnung()">Jetzt testen</button>

        <div id="debug-output" style="background: #f0f0f0; padding: 10px; margin: 10px 0;"></div>
    </div>

    <script>
        // Einfache Test-Implementierung
        const GEBINDE_PRO_PALETTE = 56;
        let debugOutput = '';

        function log(message) {
            console.log(message);
            debugOutput += message + '<br>';
            document.getElementById('debug-output').innerHTML = debugOutput;
        }

        function extractNumber(str) {
            const match = str.toString().match(/\d+/);
            return match ? parseInt(match[0], 10) : null;
        }

        function testBerechnung() {
            debugOutput = '';
            log('=== Test gestartet ===');

            const ersteGebinde = document.getElementById('erste_gebinde').value.trim();
            const letzteGebinde = document.getElementById('letzte_gebinde').value.trim();

            log('Eingaben: erste="' + ersteGebinde + '", letzte="' + letzteGebinde + '"');

            if (!ersteGebinde || !letzteGebinde) {
                log('FEHLER: Eingaben unvollständig');
                return;
            }

            const ersteNr = extractNumber(ersteGebinde);
            const letzteNr = extractNumber(letzteGebinde);

            log('Extrahierte Zahlen: erste=' + ersteNr + ', letzte=' + letzteNr);

            if (ersteNr && letzteNr && letzteNr >= ersteNr) {
                const gesamtGebinde = letzteNr - ersteNr + 1;
                const anzahlPaletten = Math.ceil(gesamtGebinde / GEBINDE_PRO_PALETTE);

                log('Berechnung: ' + gesamtGebinde + ' Gebinde = ' + anzahlPaletten + ' Paletten');

                document.getElementById('anzahl_gebinde').textContent = gesamtGebinde;
                document.getElementById('anzahl_paletten').textContent = anzahlPaletten;

                log('✅ ERFOLGREICH: Berechnung abgeschlossen');
            } else {
                log('❌ FEHLER: Ungültige Zahlen oder letzte < erste');
            }
        }

        // Event-Listener für automatische Berechnung
        document.getElementById('erste_gebinde').addEventListener('input', testBerechnung);
        document.getElementById('letzte_gebinde').addEventListener('input', testBerechnung);

        // Initial-Test
        window.onload = function () {
            log('Seite geladen - starte Initial-Test');
            testBerechnung();
        };

        log('Test-Script geladen');
    </script>
</body>

</html>
